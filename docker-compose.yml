version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nest-admin-server
    environment:
      NODE_ENV: production
      MYSQL_HOST: ${MYSQL_HOST:-172.17.0.1}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REDIS_HOST: ${REDIS_HOST:-172.17.0.1}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-172.17.0.1}
      RUSTFS_PORT: ${RUSTFS_PORT:-9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-nest-admin}
      JWT_SECRETKEY: ${JWT_SECRETKEY}
    ports:
      - "${SERVER_PORT}:8080"
    networks:
      - nest-admin-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin-vue3:
    build:
      context: ./admin-vue3
      dockerfile: Dockerfile
    container_name: nest-admin-vue3
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - server
    networks:
      - nest-admin-net

networks:
  nest-admin-net:
    driver: bridge
